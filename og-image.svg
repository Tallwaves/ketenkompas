<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#10243C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A050"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- gold accent line top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#gold)" opacity="0.7"/>

  <!-- kompasroos logo -->
  <g transform="translate(88, 275)">
    <polygon points="48,0 54,36 48,48 42,36" fill="#C8A050"/>
    <polygon points="48,96 54,60 48,48 42,60" fill="#FAF8F3" opacity="0.9"/>
    <polygon points="0,48 36,42 48,48 36,54" fill="#FAF8F3" opacity="0.9"/>
    <polygon points="96,48 60,42 48,48 60,54" fill="#FAF8F3" opacity="0.9"/>
    <polygon points="14,14 34,30 30,34" fill="#FAF8F3" opacity="0.4"/>
    <polygon points="82,14 66,30 70,34" fill="#FAF8F3" opacity="0.4"/>
    <polygon points="14,82 30,66 34,70" fill="#FAF8F3" opacity="0.4"/>
    <polygon points="82,82 66,70 70,66" fill="#FAF8F3" opacity="0.4"/>
    <circle cx="48" cy="48" r="5.5" fill="#0A1628" stroke="#C8A050" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="308" font-family="Georgia, serif" font-size="58" font-weight="400" fill="#FAF8F3" letter-spacing="-1">Keten</text>
  <text x="370" y="308" font-family="Georgia, serif" font-size="58" font-style="italic" font-weight="300" fill="#C8A050" letter-spacing="-1">Kompas</text>

  <!-- tagline -->
  <text x="200" y="348" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#8FA3B8" letter-spacing="3">SCENARIO-INSTRUMENT · NEDERLANDSE SLIBKETEN</text>

  <!-- divider -->
  <rect x="88" y="395" width="480" height="1" fill="#FAF8F3" opacity="0.12"/>

  <!-- description -->
  <text x="88" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#8FA3B8">Zuiveringen, verwerkingsroutes en opslaglocaties</text>
  <text x="88" y="458" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#8FA3B8">samen in één doorrekenbaar beeld.</text>

  <!-- stats right side -->
  <g transform="translate(780, 220)">
    <!-- card bg -->
    <rect width="340" height="220" rx="16" fill="#FAF8F3" fill-opacity="0.04" stroke="#C8A050" stroke-opacity="0.28" stroke-width="1"/>
    <rect width="340" height="2" rx="1" fill="url(#gold)" opacity="0.7"/>

    <text x="28" y="54" font-family="Georgia, serif" font-size="46" font-weight="300" fill="#FAF8F3">21</text>
    <text x="28" y="78" font-family="Arial, sans-serif" font-size="13" fill="#8FA3B8" letter-spacing="1">WATERSCHAPPEN</text>

    <line x1="28" y1="100" x2="312" y2="100" stroke="#FAF8F3" stroke-opacity="0.1"/>

    <text x="28" y="136" font-family="Georgia, serif" font-size="46" font-weight="300" fill="#FAF8F3">320<tspan font-size="20" fill="#C8A050">+</tspan></text>
    <text x="28" y="160" font-family="Arial, sans-serif" font-size="13" fill="#8FA3B8" letter-spacing="1">RWZI'S IN BEELD</text>

    <line x1="28" y1="180" x2="312" y2="180" stroke="#FAF8F3" stroke-opacity="0.1"/>

    <text x="28" y="210" font-family="Arial, sans-serif" font-size="13" fill="#5DCAA5" letter-spacing="1">● INSTRUMENT OPERATIONEEL</text>
  </g>

  <!-- bottom url -->
  <text x="88" y="590" font-family="Arial, sans-serif" font-size="15" fill="#FAF8F3" opacity="0.35" letter-spacing="1">KETENKOMPAS.NL</text>
</svg>
